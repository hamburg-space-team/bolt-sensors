project:
  rte:
    base-dir: ./generated/RTE

  define:
    - BUILD_TARGET_HARDWARE

  generators:
    options:
      - generator: CubeMX
        path: ./generated
        name: mission_bolt_exp3_config

  components:
    - component: Device:CubeMX
    - component: ARM::CMSIS:CORE
    - component: ARM::CMSIS-Compiler:CORE
    - component: CMSIS Driver:I2C
    - component: Sensor:Interfaces
    - component: CMSIS Driver:I2C:STM32 LL

  linker:
    - script: ./generated/STM32CubeMX/STM32CubeIDE/STM32U031C6TX_FLASH.ld
      for-compiler: GCC

  add-path:
    - ../../sensor-interfaces/include
    - ../../sensor-drivers/include
    - ../../hardware-adapters/include

  groups:
    - group: Example
      files:
        - file: example_mission_bolt_exp3.cpp

    - group: Sensors
      files:
        - file: ../../sensor-drivers/src/device_base.cpp
        - file: ../../hardware-adapters/src/stm32_ll_i2c.cpp
        - file: ../../sensor-drivers/src/tmp117.cpp
        - file: ../../sensor-drivers/src/mmc5983ma.cpp
